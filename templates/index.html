<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FutureFit Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'DM Sans', sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem;
      background-color: #fff;
      border-bottom: 1px solid #dee2e6;
    }
    .card-style {
      border-radius: 15px;
      padding: 1rem;
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin: 1rem;
    }

    .custom-green-btn {
    background-color: #59A37E; /* Bootstrap's success green */
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    transition: background-color 0.3s ease;
  }

  .custom-green-btn:hover {
    background-color: #218838;
  }
  </style>
</head>
<body>

 <!-- Header -->
 <div class="header">
  <i class="bi bi-envelope fs-5"></i>
  <span class="fw-bold">Hi {{ username }}</span>
  <i class="bi bi-gear fs-5"></i>
</div>

<!-- Navigation -->
<div class="d-flex justify-content-around py-3 bg-white border-bottom">
  <button class="btn btn-dark btn-sm px-4">Wellness</button>
  <button class="btn btn-outline-dark btn-sm px-4">Insure</button>
</div>

  <!-- Wellness Score Card -->
<div class="card-style text-center p-4">
  <img src="{{ url_for('static', filename='wellness_icon.jpeg') }}" alt="Target Icon" width="200" height="200">
  <h5 class="fw-bold mb-3">Your Wellness Score</h5>

  <p class="text-muted mb-4">
    Your wellness score is great!If you'd still like advice, chat to our health consultant.
  </p>


    <button class="btn custom-green-btn">
      Talk to a Health Consultant
    </button>
</div>


  <!-- Wellness Options -->
  <div class="card-style">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span><i class="bi bi-journal-text me-2"></i> View Journal</span>
      <i class="bi bi-chevron-right"></i>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span><i class="bi bi-emoji-smile me-2"></i> Track Mood</span>
      <i class="bi bi-chevron-right"></i>
    </div>
    <div class="d-flex justify-content-between align-items-center">
      <span><i class="bi bi-music-note-beamed me-2"></i> Meditation Logs</span>
      <i class="bi bi-chevron-right"></i>
    </div>
  </div>


  
</body>
</html>
